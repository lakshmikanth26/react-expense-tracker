<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Family Finance Tracker</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side routing, so a direct hit or refresh on a
      // deep route (e.g. /analytics) 404s here. This redirects the request back to
      // the app root, encoding the original path in the query string, where the
      // matching script in index.html restores it via history.replaceState.
      // See https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // number of segments in the repo base path
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
